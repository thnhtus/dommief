# spec-harness gate ở CI — chỗ `git commit --no-verify` không với tới được.
# Cài: cp adapters/ci/validate-tasks.yml .github/workflows/
name: spec-harness

on: [push, pull_request]

jobs:
  validate-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # package.json có "packageManager: pnpm" nên setup-node tự dò pnpm;
      # thiếu bước này job fail ngay với "Unable to locate
      # executable file: pnpm" (audit #4).
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with: { node-version: '24', package-manager-cache: false }
      # --preflight trước: config tự mâu thuẫn (hoặc repos[].path sai) thì mọi
      # check sau im lặng no-op. Bao gồm --self-check.
      - run: node scripts/validate-tasks.mjs --preflight
      - run: node scripts/validate-tasks.mjs
