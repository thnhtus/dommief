name: Publish

# Chạy tay: Actions → Run workflow, hoặc `gh workflow run publish`.
# Theme mặc định đóng gói sẵn trong `dommief` — chỉ publish 1 package.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core build
      # Version đã có trên npm thì bỏ qua.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/core
        run: |
          v=$(jq -r '.name+"@"+.version' package.json)
          if npm view "$v" version >/dev/null 2>&1; then
            echo "$v đã publish, bỏ qua"
          else
            pnpm publish --access public --no-git-checks
          fi
