name: Publish

# Chạy tay: Actions → Run workflow, hoặc `gh workflow run publish`.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - core
          - theme-default

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/theme-default build
      # Version đã có trên npm thì bỏ qua (chạy "all" khi chỉ bump 1 package).
      # pnpm publish thay workspace:* bằng version thật.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG: ${{ inputs.package }}
        run: |
          for d in core theme-default; do
            [ "$PKG" = all ] || [ "$PKG" = "$d" ] || continue
            cd "packages/$d"
            v=$(jq -r '.name+"@"+.version' package.json)
            if npm view "$v" version >/dev/null 2>&1; then
              echo "$v đã publish, bỏ qua"
            else
              pnpm publish --access public --no-git-checks
            fi
            cd - >/dev/null
          done
